<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23032147'/%3E%3Ccircle cx='8' cy='22' r='3' fill='%23ecad0a'/%3E%3Ccircle cx='16' cy='8' r='3' fill='%23ecad0a'/%3E%3Ccircle cx='24' cy='19' r='3' fill='%23ecad0a'/%3E%3Cpath d='M10 20l4.5-9M18.5 10l3.5 6' stroke='%23ecad0a' stroke-width='2'/%3E%3C/svg%3E">
  <title>RotasGraph | Protótipo da interface</title>
  <style>
    :root {
      --navy: #032147;
      --navy-deep: #02162f;
      --panel: #0b2c52;
      --yellow: #ecad0a;
      --purple: #753991;
      --blue: #209dd7;
      --red: #e11d48;
      --ink: #f8fafc;
      --muted: #a9bed3;
      --line: rgba(255, 255, 255, 0.14);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 92% -20%, rgba(32, 157, 215, 0.22), transparent 38%),
        var(--navy-deep);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .shell {
      width: min(1520px, 100%);
      margin: 0 auto;
      padding: 28px clamp(18px, 4vw, 56px) 48px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      position: relative;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid rgba(236, 173, 10, 0.4);
      border-radius: 12px;
      background: rgba(236, 173, 10, 0.08);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: var(--yellow);
    }

    .brand-mark::before {
      left: 10px;
      top: 20px;
      width: 22px;
      height: 2px;
      transform: rotate(-26deg);
      box-shadow: -1px 8px 0 var(--yellow);
    }

    .brand-mark::after {
      left: 9px;
      top: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      box-shadow: 17px 9px 0 var(--yellow), 3px 20px 0 var(--yellow);
    }

    .brand strong {
      display: block;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
    }

    .brand small,
    .eyebrow { color: var(--muted); }

    .meta {
      max-width: 650px;
      text-align: right;
    }

    .eyebrow {
      margin: 0 0 7px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .meta h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.6rem);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .meta p:last-child {
      margin: 9px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .prototype {
      margin-top: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(11, 44, 82, 0.72);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
      background: rgba(3, 33, 71, 0.86);
    }

    .tab {
      min-height: 66px;
      padding: 13px 18px;
      color: var(--muted);
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: color 160ms ease, background-color 160ms ease;
    }

    .tab:last-child { border-right: 0; }

    .tab:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab[aria-selected="true"] {
      color: var(--ink);
      background: linear-gradient(180deg, rgba(117, 57, 145, 0.32), rgba(117, 57, 145, 0.12));
      box-shadow: inset 0 -3px 0 var(--yellow);
    }

    .tab-index {
      display: block;
      margin-bottom: 4px;
      color: var(--yellow);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
    }

    .tab-label {
      display: block;
      font-weight: 750;
    }

    .screen[hidden] { display: none; }
    .screen figure { margin: 0; }

    .viewport {
      padding: clamp(10px, 2vw, 22px);
      background:
        linear-gradient(rgba(32, 157, 215, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32, 157, 215, 0.055) 1px, transparent 1px),
        #061c36;
      background-size: 36px 36px;
    }

    .viewport img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: #f6f5f0;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
    }

    .caption {
      display: grid;
      grid-template-columns: minmax(160px, 0.32fr) 1fr;
      gap: 24px;
      padding: 20px 22px 23px;
      border-top: 1px solid var(--line);
    }

    .caption h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .caption p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--legend-color);
    }

    .tab:focus-visible {
      position: relative;
      z-index: 1;
      outline: 3px solid var(--blue);
      outline-offset: -3px;
    }

    @media (max-width: 760px) {
      .shell { padding-inline: 12px; }
      .header, .caption { display: block; }

      .meta {
        margin-top: 24px;
        text-align: left;
      }

      .tabs {
        display: flex;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .tab {
        min-width: 190px;
        min-height: 62px;
      }

      .caption p { margin-top: 8px; }
      .viewport { padding: 6px; }
      .viewport img { border-radius: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>RotasGraph</strong>
          <small>Protótipo navegável</small>
        </span>
      </div>
      <div class="meta">
        <p class="eyebrow">Fluxo atual do MVP</p>
        <h1>Do endereço ao itinerário</h1>
        <p>Três estados reais da interface: entrada por endereço, conexão à rede e resultado multimodal.</p>
      </div>
    </header>

    <section class="prototype" aria-label="Estados da interface RotasGraph">
      <div class="tabs" role="tablist" aria-label="Etapas do protótipo">
        <button class="tab" id="tab-initial" type="button" role="tab" aria-selected="true" aria-controls="screen-initial" data-screen="initial">
          <span class="tab-index">01</span>
          <span class="tab-label">Planejar trajeto</span>
        </button>
        <button class="tab" id="tab-origin" type="button" role="tab" aria-selected="false" aria-controls="screen-origin" data-screen="origin" tabindex="-1">
          <span class="tab-index">02</span>
          <span class="tab-label">Conectar origem</span>
        </button>
        <button class="tab" id="tab-result" type="button" role="tab" aria-selected="false" aria-controls="screen-result" data-screen="result" tabindex="-1">
          <span class="tab-index">03</span>
          <span class="tab-label">Consultar itinerário</span>
        </button>
      </div>

      <div class="screen" id="screen-initial" role="tabpanel" aria-labelledby="tab-initial">
        <figure>
          <div class="viewport">
            <img src="prototipo-1-tela-inicial.png" alt="Tela inicial do RotasGraph com controles de origem, destino, limites de caminhada, horário e mapa da malha">
          </div>
          <figcaption class="caption">
            <h2>Entrada por endereço</h2>
            <p>O passageiro define origem e destino em Belo Horizonte, escolhe o horário e mantém limites independentes de caminhada para cada ponta.</p>
          </figcaption>
        </figure>
      </div>

      <div class="screen" id="screen-origin" role="tabpanel" aria-labelledby="tab-origin" hidden>
        <figure>
          <div class="viewport">
            <img src="prototipo-2-buscar-rota.png" alt="Modal de origem do RotasGraph mostrando endereço, parada recomendada e alternativas dentro do limite de caminhada">
          </div>
          <figcaption class="caption">
            <h2>Snap-to-network</h2>
            <p>O endereço é transformado em coordenadas e conectado temporariamente às paradas alcançáveis. Na origem, o usuário pode confirmar outra parada válida.</p>
          </figcaption>
        </figure>
      </div>

      <div class="screen" id="screen-result" role="tabpanel" aria-labelledby="tab-result" hidden>
        <figure>
          <div class="viewport">
            <img src="prototipo-3-instrucoes.png" alt="Resultado do RotasGraph com resumo temporal, timeline de caminhada e ônibus e rota desenhada no mapa">
          </div>
          <figcaption class="caption">
            <h2>Menor chegada</h2>
            <p>A resposta apresenta espera, deslocamento, chegada prevista, caminhada, número público da linha e o trajeto sobre a malha esquemática.</p>
          </figcaption>
        </figure>
      </div>
    </section>

    <div class="legend" aria-label="Cores dos modais">
      <span style="--legend-color: var(--yellow)">Pontos temporários</span>
      <span style="--legend-color: var(--red)">Ônibus</span>
      <span style="--legend-color: var(--blue)">Metrô</span>
      <span style="--legend-color: #888888">Caminhada</span>
    </div>
  </main>

  <script>
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];

    function selectTab(tab, moveFocus = false) {
      tabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
      });

      panels.forEach((panel) => {
        panel.hidden = panel.id !== tab.getAttribute('aria-controls');
      });

      if (moveFocus) tab.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', (event) => {
        let nextIndex = index;
        if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
        else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
        else if (event.key === 'Home') nextIndex = 0;
        else if (event.key === 'End') nextIndex = tabs.length - 1;
        else return;

        event.preventDefault();
        selectTab(tabs[nextIndex], true);
      });
    });
  </script>
</body>
</html>
